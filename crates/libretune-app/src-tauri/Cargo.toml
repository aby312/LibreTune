[package]
name = "libretune-app"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "libretune_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = { workspace = true }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
dirs = "5"
tokio = { workspace = true }
tauri-plugin-dialog = "2"
chrono = { workspace = true }
byteorder = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }

# Desktop-only: window-state plugin, OS keychain, local MCP server.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
libretune-core = { path = "../../libretune-core" }
# OS keychain storage for the AI assistant API key (graceful fallback to the
# settings file when no keychain backend is available, e.g. headless Linux).
keyring = { version = "3", features = [
    "windows-native",
    "apple-native",
    "linux-native",
] }

# Local MCP (Model Context Protocol) server: lets external agents (Claude
# Code, Claude Desktop, ...) call LibreTune's read-only tune tools over a
# loopback HTTP transport. `rmcp` owns the protocol; `axum` mounts its
# `StreamableHttpService` behind our bearer-token middleware. axum 0.8 is
# what rmcp 2.2 itself is tested against.
rmcp = { version = "2.2", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"

# Mobile: core without the wasmtime plugin host and libgit2 (lua stays).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
libretune-core = { path = "../../libretune-core", default-features = false, features = ["lua"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

